name = "sokkary-orders"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
ALLOWED_ORIGINS = "https://sokkaryjuice.pages.dev,https://bodubondk1-droid.github.io"

[[d1_databases]]
binding = "sokkary_db"
database_name = "sokkary-db"
database_id = "b12ed89d-0d64-4348-bc98-a7b394e5bee9"

# Second database that holds a full copy, refreshed every night and on demand
[[d1_databases]]
binding = "sokkary_backup"
database_name = "sokkary-backup"
database_id = "e09969cc-d3e3-433a-a86d-8224fe2918a5"

# Nightly backup at 03:00 Cairo time (01:00 UTC)
[triggers]
crons = ["0 1 * * *"]

# Secrets set in the Cloudflare dashboard (Worker > Settings > Variables and Secrets):
#   ADMIN_PASSWORD          password for the admin page (admin.html)
#   WHATSAPP_TOKEN          WhatsApp Business API permanent access token
#   WHATSAPP_VERIFY_TOKEN   any random string you choose for webhook verification
#   WHATSAPP_PHONE_ID       your WhatsApp Business phone number ID (from Meta dashboard)
#   WHATSAPP_APP_SECRET     Meta app secret (App settings > Basic); webhook posts without a valid signature are refused
# Optional variables:
#   WHATSAPP_ORDER_TEMPLATE name of the approved order confirmation template (5 body values, see src/index.js)
#   WHATSAPP_TEMPLATE_LANG  that template's language code, default "ar"
